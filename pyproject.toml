[project]
name = "pathnovo-assessment"
version = "0.1.0"
description = "Format-agnostic engineering document delta engine and grounded RAG chat system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.28.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "openai>=1.0.0",
    "chromadb>=0.4.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.1",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
norecursedirs = [".*", ".venv", ".uv_cache", ".chroma", "output", "data", "node_modules"]
